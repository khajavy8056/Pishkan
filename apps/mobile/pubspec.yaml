name: pishkan_app
description: اپلیکیشن اندروید مشتریان پیشخوان — متصل به همان سامانه و پایگاه داده نسخه وب.
publish_to: 'none'
version: 1.14.0+74

environment:
  # >=3.7: wildcard variables (`(_, _)`) used across the codebase.
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  app_links: ^6.4.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  camera: ^0.11.1
  image_cropper: ^8.0.2
  file_picker: ^8.1.7
  video_player: ^2.9.2
  url_launcher: ^6.3.1
  shamsi_date: ^1.1.1
  package_info_plus: ^8.1.3
  device_info_plus: ^11.2.0
  mobile_scanner: ^5.2.3
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  # Rich system notifications (with stage-progress bars) + background polling
  # so case progress reaches the customer like a ride-hailing app, even when
  # the app is closed — without needing a Firebase project (LAN-friendly).
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.9.0+3
  # Optional fingerprint/face unlock, like the approved design's login.
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/service_art/
    # Flutter asset directories are NOT recursive: the detail header uses a
    # 480px tile, so the folder must be listed explicitly or every detail page
    # silently falls back to the 160px catalogue image.
    - assets/service_art/large/
    - assets/category_art/
    - assets/avatars/
    # Bespoke banner art. One folder, one style: the first banner is the hero
    # the app opens with and the rest introduce individual services, so they
    # are drawn as a set rather than assembled from the service catalogue —
    # a banner that reuses a service thumbnail looks like a catalogue row
    # with a headline on it.
    - assets/banners/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
