# ---------------------------------------------------------------------------
# Pishkan — Nginx site configuration
#
# Placeholders (replaced by the installer, or edit manually):
#   __SERVER_NAME__  dns name, e.g. pishkan.example.ir  (or _ for IP-only)
#   __API_PORT__     local API port, default 3000
#   __WEB_ROOT__     absolute path to the built SPA, e.g. /opt/pishkan/current/apps/web/dist
#
# After a real domain is configured, obtain TLS with:
#   sudo certbot --nginx -d example.ir -d www.example.ir -m you@example.com --agree-tos --redirect
# Cloudflare must use SSL/TLS mode "Full (strict)" — never "Flexible".
# ---------------------------------------------------------------------------

upstream pishkan_api {
    server 127.0.0.1:__API_PORT__;
    keepalive 16;
}

# Rate limiting for authentication and public search endpoints.
limit_req_zone $binary_remote_addr zone=pishkan_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pishkan_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root __WEB_ROOT__;
    index index.html;

    # Upload size must stay in sync with the `files.max_size_mb` setting.
    client_max_body_size 20m;
    client_body_timeout 60s;

    # Do not leak the server version.
    server_tokens off;

    access_log /var/log/nginx/pishkan.access.log;
    error_log /var/log/nginx/pishkan.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Security headers. Adjust CSP if you add external resources (none by default).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-XSS-Protection "0" always;

    # Health endpoint for monitoring (no auth, no sensitive data).
    location = /api/health {
        proxy_pass http://pishkan_api;
        access_log off;
    }
    location = /api/health/live {
        proxy_pass http://pishkan_api;
        access_log off;
    }

    # Authentication endpoints get a stricter rate limit at the edge as well;
    # the API applies its own per-account limits on top of this.
    location ~ ^/api/auth/(login|otp|register|password)/ {
        limit_req zone=pishkan_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://pishkan_api;
        include /etc/nginx/snippets/pishkan-proxy.conf;
    }

    location /api/ {
        limit_req zone=pishkan_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://pishkan_api;
        include /etc/nginx/snippets/pishkan-proxy.conf;
    }

    # Private uploads are always served through the API, which checks ownership.
    location /uploads/ {
        proxy_pass http://pishkan_api;
        include /etc/nginx/snippets/pishkan-proxy.conf;
    }

    # Fingerprinted build assets: cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: the React router owns the URLs.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never expose dotfiles.
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ---------------------------------------------------------------------------
# TLS example (certbot fills this block in automatically):
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name example.ir;
#
#     ssl_certificate     /etc/letsencrypt/live/example.ir/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/example.ir/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     # ... copy the location blocks from the HTTP server above ...
# }
#
# Important: with Cloudflare proxying, mount the origin certificate and keep
# "Full (strict)". Do not disable certificate verification anywhere.
# ---------------------------------------------------------------------------
