# ---------------------------------------------------------------------------
# Pishkan — Nginx site configuration
#
# This file is a TEMPLATE. `pishkan provision` renders it twice:
#   1. HTTP  — listens on :80, serves ACME challenges and the app.
#   2. HTTPS — listens on :443 with the certificate, and :80 redirects to it.
#
# Both renders share every routing rule below, so a header or cache change can
# never end up applied to only one of them.
#
# Edit the template and re-run provision; never edit the generated copy, it is
# overwritten on the next update.
#
# Placeholders (spelled with a leading "slot:" so this comment block is not
# itself substituted — the renderer replaces every occurrence, and a
# description that contains the token would inject the value into a comment,
# which nginx then reads as a directive):
#   server_name     every hostname this site answers to (space separated)
#   listen          the listen directives, indented
#   ssl             ssl_certificate / protocol directives (empty on HTTP)
#   redirect        :80 → :443 redirect block (empty on the HTTP render)
#   api port        local API port, default 3000
#   web root        absolute path to the built SPA
#   acme root       document root for certbot's HTTP-01 challenge
# ---------------------------------------------------------------------------

upstream pishkan_api {
    server 127.0.0.1:__API_PORT__;
    keepalive 16;
}

# Rate limiting for authentication and public search endpoints.
limit_req_zone $binary_remote_addr zone=pishkan_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pishkan_api:10m rate=120r/m;

# Cloudflare's edge network. When Cloudflare proxies the domain, the real client
# address arrives in CF-Connecting-IP; without trusting these ranges every
# request looks like it came from Cloudflare and the per-IP rate limits above
# collapse into one shared bucket.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
__LISTEN__
__SSL__
    server_name __SERVER_NAME__;

    root __WEB_ROOT__;
    index index.html;

    # Upload size must stay in sync with the `files.max_size_mb` setting.
    client_max_body_size 20m;
    client_body_timeout 60s;

    # Do not leak the server version.
    server_tokens off;

    access_log /var/log/nginx/pishkan.access.log;
    error_log /var/log/nginx/pishkan.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Security headers. Adjust CSP if you add external resources (none by default).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-XSS-Protection "0" always;
__REDIRECT__
    # ACME HTTP-01 challenge. Must come before the SPA fallback: a request for
    # /.well-known/acme-challenge/<token> that reaches index.html returns 200
    # with HTML, so certbot reports "unauthorized" — which reads exactly like a
    # DNS failure but is not. Works the same behind Cloudflare.
    location ^~ /.well-known/acme-challenge/ {
        root __ACME_ROOT__;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    # Health endpoint for monitoring (no auth, no sensitive data).
    location = /api/health {
        proxy_pass http://pishkan_api;
        access_log off;
    }
    location = /api/health/live {
        proxy_pass http://pishkan_api;
        access_log off;
    }

    # Authentication endpoints get a stricter rate limit at the edge as well;
    # the API applies its own per-account limits on top of this.
    location ~ ^/api/auth/(login|otp|register|password)/ {
        limit_req zone=pishkan_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://pishkan_api;
        include /etc/nginx/snippets/pishkan-proxy.conf;
    }

    location /api/ {
        limit_req zone=pishkan_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://pishkan_api;
        include /etc/nginx/snippets/pishkan-proxy.conf;
    }

    # Private uploads are always served through the API, which checks ownership.
    location /uploads/ {
        proxy_pass http://pishkan_api;
        include /etc/nginx/snippets/pishkan-proxy.conf;
    }

    # Fingerprinted build assets: cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # When BLOG_MODE=subdomain, old /blog links must keep working. The block is
    # rendered by the provisioner and is the only place that knows the blog host.
__BLOG_REDIRECT__
    # SPA fallback: the React router owns the URLs.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never expose dotfiles (ACME is handled above).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
