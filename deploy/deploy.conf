# ---------------------------------------------------------------------------
# Pishkan — deployment manifest
#
# Edit this file, then run `sudo pishkan provision` (or the installer) once.
# Everything below is read from here: nginx server names, TLS certificates,
# CORS origins, the public URL and the app's own links. Nothing is asked
# interactively, so a re-run always produces the same result from the same file.
#
# Where it lives on the server:  /etc/pishkan/deploy.conf
# In the repo:                   deploy/deploy.conf  (a template — never secrets)
#
# Syntax: plain `KEY=value`, one per line. `#` starts a comment.
# Values are read literally, so do not wrap them in quotes unless the quotes
# are meant to be part of the value.
# ---------------------------------------------------------------------------

# === Identity ================================================================

# The primary domain. Everything else hangs off it.
# Behind Cloudflare: keep DNS "Proxied" (orange cloud) — nginx still needs a
# real certificate, because Cloudflare in "Full (strict)" mode validates it.
DOMAIN=pishkan.example.ir

# Optional www alias. Leave empty to skip it entirely.
DOMAIN_WWW=www.pishkan.example.ir

# Address Let's Encrypt uses for expiry warnings.
# Use a mailbox you actually read; a bad address only means you stop getting
# renewal warnings, not that renewal fails.
ACME_EMAIL=admin@example.ir

# Extra hostnames the main site must answer to (space-separated).
# Useful during migration from an old domain: both keep working, and the
# certificate covers both, so nobody hits a warning page.
DOMAIN_ALIASES=

# === Sub-domains =============================================================

# Which parts of the app live on their own hostname.
#
#   inline  — served under the main domain (e.g. /blog). Nothing to configure;
#             this is the historical behaviour and the safest default.
#   subdomain — served from its own hostname, e.g. blog.example.ir. Existing
#             /blog links keep working: nginx 301-redirects them, so shared
#             links and search results do not break.
#
# Supported sections:
#   blog     the public blog (/blog, /blog/:slug)
#
# Adding a section here is enough — `pishkan provision` writes the nginx block,
# obtains the certificate and reloads. No manual editing of nginx.
BLOG_MODE=inline
BLOG_SUBDOMAIN=blog.pishkan.example.ir

# === TLS =====================================================================

# auto   — obtain/renew Let's Encrypt certificates with certbot (recommended)
# off    — HTTP only (only for a first smoke test before DNS is ready)
TLS_MODE=auto

# How the browser reaches the server. This is about the Cloudflare hop:
#   full_strict — Cloudflare talks HTTPS to the origin (recommended)
#   full        — HTTPS to origin, certificate not validated (avoid)
#   flexible    — Cloudflare talks plain HTTP to the origin
#                 ⚠ redirect loops and broken "secure" cookies. Never use it.
# Setting flexible here is not silently accepted: the installer warns and the
# health check fails, because session cookies are HTTPS-only.
CLOUDFLARE_SSL_MODE=full_strict

# === Regional / operational ==================================================

# Timezone for timers, logs and the admin UI.
TIMEZONE=Asia/Tehran

# Where Cloudflare prefixes the client IP header. Leave as-is behind
# Cloudflare; set `off` when the server is reached directly.
TRUST_PROXY=true

# Install the daily backup timer (02:30 local time).
BACKUP_ENABLED=true

# Keep this many successful release directories, plus the `previous` one.
# Older releases are pruned after a successful update; a failed update never
# deletes anything, so a broken build stays available for inspection.
KEEP_RELEASES=5
