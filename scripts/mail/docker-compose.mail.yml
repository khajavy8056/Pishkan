# docker-mailserver for Pishkan organizational mail.
# Rendered by `pishkan-mail install` (substitutes ${MAIL_DOMAIN}/${MAIL_HOSTNAME}).
# Docs: https://docker-mailserver.github.io/docker-mailserver/latest/
#
# Provides SMTP (25/465/587) + IMAPS (993) so the Gmail Android app can send and
# receive via "Add account → Other (IMAP)". Rspamd handles spam + DKIM signing;
# Fail2ban blocks brute force. TLS uses the Let's Encrypt cert for mail.<domain>.
services:
  mail:
    image: ${MAIL_IMAGE:-ghcr.io/docker-mailserver/docker-mailserver:latest}
    container_name: pishkan-mail
    hostname: ${MAIL_HOSTNAME}
    domainname: ${MAIL_DOMAIN}
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      - "25:25"     # SMTP inbound (must be open at the provider; set PTR)
      - "465:465"   # SMTPS (Gmail outgoing)
      - "587:587"   # Submission STARTTLS (Gmail outgoing alternative)
      - "993:993"   # IMAPS (Gmail incoming)
    volumes:
      - ./data/:/var/mail/
      - ./state/:/var/mail-state/
      - ./config/:/tmp/docker-mailserver/
      - ./logs/:/var/log/mail/
      - /etc/letsencrypt/:/etc/letsencrypt/:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - OVERRIDE_HOSTNAME=${MAIL_HOSTNAME}.${MAIL_DOMAIN}
      - ENABLE_RSPAMD=1            # spam filtering + DKIM signing
      - ENABLE_OPENDKIM=0
      - ENABLE_AMAVIS=0
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0            # antivirus off by default (RAM); enable if >=2GB spare
      - ENABLE_FAIL2BAN=1
      - ENABLE_POSTGREY=0
      - SSL_TYPE=letsencrypt
      - SSL_CERT_PATH=/etc/letsencrypt/live/${MAIL_HOSTNAME}.${MAIL_DOMAIN}/fullchain.pem
      - SSL_KEY_PATH=/etc/letsencrypt/live/${MAIL_HOSTNAME}.${MAIL_DOMAIN}/privkey.pem
      - POSTMASTER_ADDRESS=postmaster@${MAIL_DOMAIN}
      - TZ=UTC
      - LOG_LEVEL=info
    cap_add:
      - NET_ADMIN                  # Fail2ban needs iptables
    healthcheck:
      test: ["CMD-SHELL", "ss -ltn | grep -q ':993' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
