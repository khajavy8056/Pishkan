name: Deploy to VPS

# Manual, audited deployment to the production VPS over SSH.
# - Credentials live ONLY in encrypted repository secrets (never in the repo,
#   never in chat). GitHub masks secret values in the public log.
# - The server-side script validates every input, escalates with sudo -n when
#   needed, and never prints secrets. The install report is sanitized.
# - The installer is idempotent: it never deletes customer data. Updates go
#   through `pishkan update --ref <full SHA>` with automatic backup + rollback.
# - Each run's full output is published to the `pishkan-deploy-reports` branch
#   (server IP redacted) so the agent can read it via the contents API and
#   diagnose failures — the raw Actions log host is not reachable from the sandbox.
#
# Two triggers:
#   workflow_dispatch   — the "Run workflow" button in the Actions tab (operator).
#   repository_dispatch — the agent triggers it via the API (type: pishkan-deploy,
#                         parameters in client_payload). Same job, same validation.
#
# Required secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY
# Optional secrets: VPS_PORT (default 22), VPS_HOST_KEY (pinned known_hosts line)
# Guide: docs/DEPLOY-GITHUB-ACTIONS-FA.md

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation to run on the server'
        type: choice
        required: true
        default: doctor
        options:
          - install
          - update
          - doctor
          - status
          - provision-tls
          - backup
          - report
          - logs
          - reset
      domain:
        description: 'Public domain, e.g. office.example.ir (blank = IP-only install / keep existing config)'
        type: string
        required: false
        default: ''
      acme_email:
        description: "Email for Let's Encrypt expiry warnings (required when domain is set)"
        type: string
        required: false
        default: ''
      force:
        description: 'Re-run installer even if installed (data preserved); REQUIRED for reset (stops service, keeps all data)'
        type: boolean
        default: false
      ref:
        description: 'Full 40-char commit SHA to install/update (blank = the commit this workflow runs on)'
        type: string
        required: false
        default: ''
  repository_dispatch:
    types: [pishkan-deploy]

# contents:write is needed only to publish the run report to the reports branch.
permissions:
  contents: write

concurrency:
  group: pishkan-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          ACTION: ${{ inputs.action || github.event.client_payload.action || 'doctor' }}
          DOMAIN: ${{ inputs.domain || github.event.client_payload.domain || '' }}
          ACME_EMAIL: ${{ inputs.acme_email || github.event.client_payload.acme_email || '' }}
          FORCE: ${{ inputs.force || github.event.client_payload.force || 'false' }}
          REF_INPUT: ${{ inputs.ref || github.event.client_payload.ref || '' }}
          GITHUB_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          bash scripts/ci/deploy-run.sh 2>&1 | tee "$RUNNER_TEMP/deploy-output.log"

      - name: Publish deploy report (readable by the agent)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/ci/publish-report.sh "$RUNNER_TEMP/deploy-output.log"
