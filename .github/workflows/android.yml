name: Android (Customer App)

# Builds the native Flutter customer app in apps/mobile.
# - Push to the working branch / main → analyze + tests + installable APKs as CI artifacts.
# - Tag `android-vX.Y.Z`              → additionally publishes a GitHub Release with split APKs + AAB.
# Signing: when the ANDROID_* repository secrets exist, release builds are
# signed with the official key; otherwise they fall back to the debug key
# (fine for testing, never for a public release — see apps/mobile/README.md).

on:
  push:
    branches:
      - 'arena/ffc5afe7-pishkan'
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android.yml'
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Default server baked into the app (blank = ask on first run)'
        required: false
        default: ''
      app_env:
        description: 'Environment label (local / staging / production)'
        required: false
        default: 'local'

permissions:
  contents: write

jobs:
  android:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.ANDROID_API_BASE_URL }}
      APP_ENV: ${{ github.event.inputs.app_env || (startsWith(github.ref, 'refs/tags/') && 'production') || 'local' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: |
          mkdir -p ../../dist-android
          flutter test || status=$?
          cp test-report.json ../../dist-android/ 2>/dev/null || true
          exit ${status:-0}

      - name: Prepare release signing (when secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/pishkan-release.p12
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=pishkan-release.p12
          EOF
            echo "::notice::Release signing: official keystore from secrets."
          else
            echo "::warning::No ANDROID_* signing secrets — release will use the DEBUG key. Do not publish this build publicly."
          fi

      - name: Build split APKs (arm64 + armv7 + x86_64)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Build App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Collect outputs
        run: |
          mkdir -p ../../dist-android
          cp build/app/outputs/flutter-apk/*-release.apk ../../dist-android/
          cp build/app/outputs/bundle/release/*.aab ../../dist-android/
          ls -lh ../../dist-android

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pishkan-android
          path: dist-android/*
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: اپ اندروید مشتریان پیشخوان ${{ github.ref_name }}
          body: |
            نسخهٔ اندروید مشتریان پیشخوان.

            **نصب روی گوشی:** فایل `app-arm64-v8a-release.apk` برای بیشتر گوشی‌های امروزی؛ برای گوشی‌های قدیمی‌تر `app-armeabi-v7a-release.apk`.
            فایل `.aab` برای انتشار در فروشگاه‌هاست.

            بعد از نصب، اپ را به آدرس سامانهٔ دفترتان وصل کنید (اگر در این بیلد از پیش تنظیم نشده باشد، در اولین اجرا آدرس را می‌پرسد).
          files: dist-android/*
